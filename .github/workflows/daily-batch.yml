name: Daily KBO Batch

on:
  schedule:
    - cron: '0 15 * * *'  # UTC 15:00 = KST 00:00
  workflow_dispatch:
    inputs:
      date:
        description: '대상 날짜 (YYYYMMDD). 비워두면 어제'
        required: false

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily batch
        env:
          # daily_batch는 LLM을 호출하지 않음 (수집/ELO/피처만)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--date ${{ inputs.date }}"
          fi
          python scripts/daily_batch.py $ARGS

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "daily: ELO update + accuracy tracking"
          # 글롭 금지 — data/*.jsonl 은 gitignore된 llm_costs.jsonl 을,
          # data/*.db 는 kbo_auth.db 를 잡아 git add 가 exit 128 로 죽는다.
          file_pattern: "data/daily_results.jsonl data/pitching_logs.jsonl data/elo_ratings.json data/prediction_history.json data/standings.json data/features/game_features_v5.csv"
